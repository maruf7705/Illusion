[workspace]
resolver = "2"
members = [
    "crates/illusion-core",
    "crates/illusion-native-host",
    "crates/illusion-cli",
    "crates/illusion-gui",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Illusion Contributors"]
license = "MIT"
repository = "https://github.com/maruf7705/Illusion"

[workspace.dependencies]
tokio = { version = "1.40", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json", "cookies"] }
futures-util = "0.3"
bytes = "1.7"
url = "2.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1.0"
anyhow = "1.0"
sha2 = "0.10"
hex = "0.4"
nix = { version = "0.29", features = ["fs"] }
directories = "5.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
urlencoding = "2.1"
eframe = "0.29"
ksni = "0.3.7"
arboard = "3.4"
rfd = "0.15"
open = "5.3"
