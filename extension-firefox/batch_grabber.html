<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Illusion Batch Media Grabber</title>
  <style>
    :root {
      --bg: #1e1e2e;
      --card-bg: #24273a;
      --accent: #89b4fa;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --border: #313244;
      --green: #a6e3a1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 20px; font-size: 13px; min-width: 650px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; border-bottom: 1px solid var(--border); padding-bottom: 12px; }
    h1 { font-size: 16px; font-weight: 700; color: var(--accent); display: flex; align-items: center; gap: 8px; }
    .filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .filter-btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 12px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .filter-btn.active { background: var(--accent); color: #11111b; font-weight: 700; border-color: var(--accent); }
    .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .btn { background: var(--card-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-primary { background: var(--accent); color: #11111b; font-weight: 700; border: none; }
    .btn-primary:hover { opacity: 0.9; }
    .items-container { max-height: 420px; overflow-y: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--card-bg); }
    .item-row { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .item-row:last-child { border-bottom: none; }
    .item-row:hover { background: rgba(255, 255, 255, 0.03); }
    .item-check { cursor: pointer; }
    .item-icon { font-size: 16px; }
    .item-info { flex: 1; overflow: hidden; }
    .item-title { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .item-meta { color: var(--subtext); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge { font-size: 10px; background: rgba(137, 180, 250, 0.2); color: var(--accent); padding: 2px 6px; border-radius: 4px; font-weight: 700; }
  </style>
</head>
<body>
  <header>
    <h1>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
      </svg>
      Illusion Batch Media & Video Grabber
    </h1>
    <span id="found-count" class="badge">0 Items Found</span>
  </header>

  <div class="filters">
    <button class="filter-btn active" data-type="all">All Media</button>
    <button class="filter-btn" data-type="video">Videos</button>
    <button class="filter-btn" data-type="audio">Audio</button>
    <button class="filter-btn" data-type="images">Images</button>
    <button class="filter-btn" data-type="files">Documents & Archives</button>
  </div>

  <div class="action-bar">
    <div style="display: flex; gap: 8px;">
      <button class="btn" id="btn-select-all">Select All</button>
      <button class="btn" id="btn-deselect-all">Deselect All</button>
    </div>
    <button class="btn btn-primary" id="btn-download-selected">Download Selected to Illusion</button>
  </div>

  <div class="items-container" id="items-list">
    <div style="padding: 24px; text-align: center; color: var(--subtext);">Scanning page media...</div>
  </div>

  <script src="batch_grabber.js"></script>
</body>
</html>
