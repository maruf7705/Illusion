# Hyprland Window Rules for Illusion Download Manager
# Include this file in your ~/.config/hypr/hyprland.conf:
# source = ~/.config/hypr/illusion.conf (or copy the rules below)

# Float small dialogs (Add Download, Progress popup, Preferences)
windowrulev2 = float, class:^(illusion)$, title:^(Add Download|Download Progress|Preferences|About Illusion)$
windowrulev2 = center, class:^(illusion)$, title:^(Add Download)$
windowrulev2 = size 620 400, class:^(illusion)$, title:^(Add Download)$
windowrulev2 = size 700 450, class:^(illusion)$, title:^(Download Progress)$

# Make dialogs stay above when focused
windowrulev2 = stayfocused, class:^(illusion)$, title:^(Add Download)$

# Optional: Add subtle opacity/blur if desired
windowrulev2 = opacity 0.95 0.90, class:^(illusion)$
